name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version'
        required: true
        default: 'latest'

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Copy frontend to API wwwroot for testing
        run: |
          Remove-Item -Recurse -Force src/ZTR.Api/wwwroot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path src/ZTR.Api/wwwroot
          Copy-Item -Recurse frontend/dist/* src/ZTR.Api/wwwroot/

      - name: Build and test backend
        run: |
          dotnet restore ZTR_OS.sln
          dotnet test tests/ZTR.HAL.Tests/ZTR.HAL.Tests.csproj -c Release --results-directory ./TestResults --filter "FullyQualifiedName!~AsusAcpiTests&FullyQualifiedName!~AudioControlTests&FullyQualifiedName!~ScreenControlTests&FullyQualifiedName!~CpuAffinityManagerExtendedTests"
          dotnet test tests/ZTR.Intelligence.Tests/ZTR.Intelligence.Tests.csproj -c Release --results-directory ./TestResults
          dotnet test tests/ZTR.Api.Tests/ZTR.Api.Tests.csproj -c Release --results-directory ./TestResults --filter "FullyQualifiedName!~MlpController_ConfigAndStatus&FullyQualifiedName!~GetMode_ReturnsCurrentMode&FullyQualifiedName!~DesktopHost_Diagnostics_EndpointReportsHardware&FullyQualifiedName!~GetMlpStatus_ReturnsBoolean&FullyQualifiedName!~FullPipeline_SensorQueue&FullyQualifiedName!~ListProcesses_ReturnsList&FullyQualifiedName!~ProcessController_ListProcesses"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/**/*.xml
          retention-days: 30

  publish-win-x64:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish API (NativeAOT, self-contained)
        run: |
          dotnet publish src/ZTR.Api/ZTR.Api.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -p:BuildFrontend=false -o ./artifacts/win-x64/api
        shell: pwsh

      - name: Publish Service (NativeAOT, self-contained)
        run: |
          dotnet publish src/ZTR.Service/ZTR.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -p:BuildFrontend=false -o ./artifacts/win-x64/service
        shell: pwsh

      - name: Copy frontend to publish output
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts/win-x64/api/wwwroot
          Copy-Item -Recurse frontend/dist/* ./artifacts/win-x64/api/wwwroot/
          New-Item -ItemType Directory -Force -Path ./artifacts/win-x64/frontend
          Copy-Item -Recurse frontend/dist/* ./artifacts/win-x64/frontend/
        shell: pwsh

      - name: Verify frontend in API output
        run: |
          if (-not (Test-Path ./artifacts/win-x64/api/wwwroot/index.html)) {
            Write-Error "wwwroot/index.html not found in API output!"
            exit 1
          }
          Write-Output "API wwwroot verified"
        shell: pwsh

      - name: Package Windows release
        run: |
          "ZTR_OS $env:TAG Windows Release`nNativeAOT compiled, self-contained single-file binary. No .NET runtime required." | Out-File -FilePath ./artifacts/win-x64/README.txt -Encoding utf8
          Compress-Archive -Path ./artifacts/win-x64/* -DestinationPath "ZTR_OS-$env:TAG-win-x64.zip" -Force
          Get-ChildItem "ZTR_OS-$env:TAG-win-x64.zip" | Select-Object Name, Length
        shell: pwsh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ZTR_OS-${{ env.TAG }}-win-x64.zip

  publish-linux-x64:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package Linux frontend distribution
        run: |
          mkdir -p ./artifacts/linux-x64/frontend
          cp -r frontend/dist/* ./artifacts/linux-x64/frontend/
          printf 'ZTR_OS %s Linux Frontend Release\n\nThis package contains the ZTR_OS frontend (React SPA) which can be served by any static web server.\n\nThe ZTR_OS API backend requires Windows (ASUS hardware ACPI access) and is not included in this Linux package.\n\nTo serve the frontend:\n  cd frontend\n  python3 -m http.server 5000\n\nFor the full Windows Desktop experience (WPF + WebView2 + embedded API),\nplease use the Windows release build instead.\n' "${TAG}" > ./artifacts/linux-x64/README.txt
          cd artifacts/linux-x64
          tar -czf "../../ZTR_OS-${TAG}-linux-x64.tar.gz" .
          cd ../../
          ls -lh ZTR_OS-${TAG}-linux-x64.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ZTR_OS-${{ env.TAG }}-linux-x64.tar.gz

  publish-desktop-win-x64:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish Desktop (NativeAOT, self-contained, single-file)
        run: |
          dotnet publish src/ZTR.Desktop/ZTR.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -p:BuildFrontend=false -o ./artifacts/desktop-win-x64
        shell: pwsh

      - name: Copy frontend to desktop publish output
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts/desktop-win-x64/wwwroot
          Copy-Item -Recurse frontend/dist/* ./artifacts/desktop-win-x64/wwwroot/
        shell: pwsh

      - name: Verify artifacts
        run: |
          Write-Output "=== Desktop publish output ==="
          Get-ChildItem ./artifacts/desktop-win-x64 -Name
          Write-Output "=== wwwroot contents ==="
          if (Test-Path ./artifacts/desktop-win-x64/wwwroot) {
            Get-ChildItem ./artifacts/desktop-win-x64/wwwroot -Recurse | Select-Object FullName, Length
          }
          if (-not (Test-Path ./artifacts/desktop-win-x64/wwwroot/index.html)) {
            Write-Error "wwwroot/index.html not found! Frontend bundling failed."
            exit 1
          }
          $exeCount = (Get-ChildItem ./artifacts/desktop-win-x64 -Filter "*.exe" -ErrorAction SilentlyContinue).Count
          Write-Output "Found $exeCount .exe file(s) in output"
          if ($exeCount -eq 0) {
            Write-Error "No .exe found in publish output!"
            exit 1
          }
        shell: pwsh

      - name: Package desktop release
        run: |
          "ZTR_OS $env:TAG Desktop Release`nWPF + WebView2 + Virtual Host Frontend`nNativeAOT compiled, self-contained single-file binary. No .NET runtime required.`nEmbedded Kestrel API on port 5000-5010." | Out-File -FilePath ./artifacts/desktop-win-x64/README.txt -Encoding utf8
          Compress-Archive -Path ./artifacts/desktop-win-x64/* -DestinationPath "ZTR_OS-$env:TAG-desktop-win-x64.zip" -Force
          Get-ChildItem "ZTR_OS-$env:TAG-desktop-win-x64.zip" | Select-Object Name, Length
        shell: pwsh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ZTR_OS-${{ env.TAG }}-desktop-win-x64.zip