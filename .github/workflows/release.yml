name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version'
        required: true
        default: 'latest'

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Copy frontend to API wwwroot for testing
        run: |
          rm -rf src/ZTR.Api/wwwroot
          mkdir -p src/ZTR.Api/wwwroot
          cp -r frontend/dist/* src/ZTR.Api/wwwroot/

      - name: Build and test backend
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --results-directory ./TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/**/*.xml
          retention-days: 30

  publish-win-x64:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish API
        run: |
          dotnet publish src/ZTR.Api/ZTR.Api.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o ./artifacts/win-x64/api

      - name: Publish Service
        run: |
          dotnet publish src/ZTR.Service/ZTR.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o ./artifacts/win-x64/service

      - name: Copy frontend to publish output
        run: |
          mkdir -p ./artifacts/win-x64/api/wwwroot
          cp -r frontend/dist/* ./artifacts/win-x64/api/wwwroot/
          mkdir -p ./artifacts/win-x64/frontend
          cp -r frontend/dist/* ./artifacts/win-x64/frontend/

      - name: Package release
        run: |
          echo "ZTR_OS ${TAG} Windows Release" > ./artifacts/win-x64/README.txt
          echo "Self-contained single-file. No .NET runtime required." >> ./artifacts/win-x64/README.txt
          cd artifacts/win-x64
          zip -r "../../ZTR_OS-${TAG}-win-x64.zip" .
          cd ../../
          ls -lh ZTR_OS-${TAG}-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ZTR_OS-${{ env.TAG }}-win-x64.zip

  publish-linux-x64:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish API
        run: |
          dotnet publish src/ZTR.Api/ZTR.Api.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o ./artifacts/linux-x64/api

      - name: Copy frontend to publish output
        run: |
          mkdir -p ./artifacts/linux-x64/api/wwwroot
          cp -r frontend/dist/* ./artifacts/linux-x64/api/wwwroot/
          mkdir -p ./artifacts/linux-x64/frontend
          cp -r frontend/dist/* ./artifacts/linux-x64/frontend/

      - name: Package release
        run: |
          echo "ZTR_OS ${TAG} Linux Release" > ./artifacts/linux-x64/README.txt
          echo "Self-contained single-file. No .NET runtime required." >> ./artifacts/linux-x64/README.txt
          cd artifacts/linux-x64
          tar -czf "../../ZTR_OS-${TAG}-linux-x64.tar.gz" .
          cd ../../
          ls -lh ZTR_OS-${TAG}-linux-x64.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ZTR_OS-${{ env.TAG }}-linux-x64.tar.gz

  publish-desktop-win-x64:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish Desktop
        run: |
          dotnet publish src/ZTR.Desktop/ZTR.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o ./artifacts/desktop-win-x64
        shell: pwsh

      - name: Copy frontend to desktop output
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts/desktop-win-x64/wwwroot | Out-Null
          Copy-Item -Path frontend/dist/* -Destination ./artifacts/desktop-win-x64/wwwroot/ -Recurse -Force
        shell: pwsh

      - name: Package desktop release
        run: |
          "ZTR_OS ${TAG} Desktop Release`nWPF + WebView2 + Embedded Kestrel`nSingle-file self-contained. No .NET runtime required." | Out-File -FilePath ./artifacts/desktop-win-x64/README.txt -Encoding utf8
          Compress-Archive -Path ./artifacts/desktop-win-x64/* -DestinationPath "ZTR_OS-${TAG}-desktop-win-x64.zip" -Force
          Get-ChildItem "ZTR_OS-${TAG}-desktop-win-x64.zip" | Select-Object Name, Length
        shell: pwsh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ZTR_OS-${{ env.TAG }}-desktop-win-x64.zip
