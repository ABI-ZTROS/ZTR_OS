name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/**
          retention-days: 7

  backend:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Restore dependencies
        run: dotnet restore ZTR_OS.sln

      - name: Build solution
        run: dotnet build ZTR_OS.sln --no-restore -c Release -p:BuildFrontend=false

      - name: Run tests
        run: |
          dotnet test tests/ZTR.HAL.Tests/ZTR.HAL.Tests.csproj -c Release --results-directory ./TestResults
          dotnet test tests/ZTR.Intelligence.Tests/ZTR.Intelligence.Tests.csproj -c Release --results-directory ./TestResults
          dotnet test tests/ZTR.Api.Tests/ZTR.Api.Tests.csproj -c Release --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/**/*.xml
          retention-days: 7
