name: Windows Build Verification

on:
  push:
    branches: [main]
    paths:
      - 'src/ZTR.Desktop/**'
      - 'src/ZTR.Api/**'
      - 'src/ZTR.HAL/**'
      - 'src/ZTR.Intelligence/**'
      - 'src/ZTR.Models/**'
      - 'src/ZTR.Common/**'
      - 'src/ZTR.Service/**'
      - 'frontend/**'
      - '.github/workflows/ci-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy frontend to API wwwroot
        run: |
          Remove-Item -Recurse -Force src/ZTR.Api/wwwroot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path src/ZTR.Api/wwwroot
          Copy-Item -Recurse frontend/dist/* src/ZTR.Api/wwwroot/

      - name: Restore dependencies
        run: dotnet restore ZTR_OS.sln

      - name: Build API (net9.0-windows)
        run: dotnet build src/ZTR.Api/ZTR.Api.csproj --no-restore -c Release

      - name: Build Desktop (WPF, net9.0-windows)
        run: dotnet build src/ZTR.Desktop/ZTR.Desktop.csproj --no-restore -c Release -p:BuildFrontend=false

      - name: Verify frontend in output
        run: |
          $desktopBin = Get-ChildItem -Path src/ZTR.Desktop/bin/Release/net9.0-windows -Directory | Select-Object -First 1
          if ($desktopBin) {
            $wwwroot = Join-Path $desktopBin.FullName "wwwroot"
            if (Test-Path $wwwroot) {
              Write-Output "wwwroot exists: $wwwroot"
              Get-ChildItem $wwwroot -Recurse | Select-Object FullName, Length
            } else {
              Write-Output "wwwroot not in output, checking if embedded resource..."
              # Check if wwwroot.zip is embedded
              Get-ChildItem -Path $desktopBin.FullName -Filter "*.zip" -ErrorAction SilentlyContinue
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: |
            src/ZTR.Desktop/bin/Release/net9.0-windows/**
            src/ZTR.Api/bin/Release/net9.0-windows/**
          retention-days: 7
