name: Windows Build Verification

on:
  push:
    branches: [main]
    paths:
      - 'src/ZTR.Desktop/**'
      - 'src/ZTR.Api/**'
      - 'src/ZTR.HAL/**'
      - 'src/ZTR.Intelligence/**'
      - 'src/ZTR.Models/**'
      - 'src/ZTR.Common/**'
      - 'src/ZTR.Service/**'
      - 'frontend/**'
      - '.github/workflows/ci-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy frontend to API wwwroot
        run: |
          Remove-Item -Recurse -Force src/ZTR.Api/wwwroot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path src/ZTR.Api/wwwroot
          Copy-Item -Recurse frontend/dist/* src/ZTR.Api/wwwroot/

      - name: Restore dependencies
        run: dotnet restore ZTR_OS.sln

      - name: Publish Desktop (self-contained, single-file)
        run: |
          dotnet publish src/ZTR.Desktop/ZTR.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:BuildFrontend=false `
            -o publish/desktop

      - name: Publish API (self-contained, single-file)
        run: |
          dotnet publish src/ZTR.Api/ZTR.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:BuildFrontend=false `
            -o publish/api

      - name: Ensure wwwroot in publish outputs
        run: |
          # Desktop publish: Desktop doesn't auto-include wwwroot, copy it manually
          if (-not (Test-Path publish/desktop/wwwroot)) {
            New-Item -ItemType Directory -Force -Path publish/desktop/wwwroot
          }
          Copy-Item -Recurse -Force frontend/dist/* publish/desktop/wwwroot/
          Write-Output "Desktop wwwroot:"
          Get-ChildItem publish/desktop/wwwroot -Recurse | Select-Object FullName

          # API publish: SDK.Web projects auto-include wwwroot, but verify
          if (-not (Test-Path publish/api/wwwroot)) {
            Write-Output "WARNING: API publish missing wwwroot - copying manually"
            New-Item -ItemType Directory -Force -Path publish/api/wwwroot
            Copy-Item -Recurse -Force frontend/dist/* publish/api/wwwroot/
          } else {
            Write-Output "API wwwroot exists:"
            Get-ChildItem publish/api/wwwroot -Recurse | Select-Object FullName
          }

      - name: Verify publish output
        run: |
          Write-Output "=== Desktop publish ==="
          Get-ChildItem publish/desktop -File | Select-Object Name, Length
          Write-Output "=== API publish ==="
          Get-ChildItem publish/api -File | Select-Object Name, Length
          Write-Output "=== Checking for .exe entry points ==="
          $desktopExe = Get-ChildItem publish/desktop -Filter "*.exe" -ErrorAction SilentlyContinue
          $apiExe = Get-ChildItem publish/api -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($desktopExe) {
            Write-Output "Desktop exe: $($desktopExe.Name) ($([math]::Round($desktopExe.Length/1MB, 2)) MB)"
          } else {
            Write-Output "WARNING: No Desktop .exe found!"
          }
          if ($apiExe) {
            Write-Output "API exe: $($apiExe.Name) ($([math]::Round($apiExe.Length/1MB, 2)) MB)"
          } else {
            Write-Output "WARNING: No API .exe found!"
          }

      - name: Create Desktop distribution zip
        run: |
          Compress-Archive -Path publish/desktop/* -DestinationPath ZTR-Desktop-win-x64.zip -Force
          Write-Output "ZTR-Desktop-win-x64.zip: $([math]::Round((Get-Item ZTR-Desktop-win-x64.zip).Length/1MB, 2)) MB"

      - name: Create API distribution zip
        run: |
          Compress-Archive -Path publish/api/* -DestinationPath ZTR-API-win-x64.zip -Force
          Write-Output "ZTR-API-win-x64.zip: $([math]::Round((Get-Item ZTR-API-win-x64.zip).Length/1MB, 2)) MB"

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZTR-Desktop-win-x64
          path: ZTR-Desktop-win-x64.zip
          retention-days: 7

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZTR-API-win-x64
          path: ZTR-API-win-x64.zip
          retention-days: 7
