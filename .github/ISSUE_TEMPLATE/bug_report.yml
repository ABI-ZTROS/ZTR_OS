name: Bug Report
about: Create a bug report to help us improve ZTR_OS
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: ""

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Add logs or stack trace to help diagnose the problem.
      placeholder: Paste your logs here

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g., Windows 11, ASUS ROG Strix Scar

  - type: input
    id: dotnet-version
    attributes:
      label: .NET Version
      placeholder: e.g., 9.0.100

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.